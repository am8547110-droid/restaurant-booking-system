<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حجز طاولة</title>
    <style>
        body { font-family: Arial; text-align: center; background: #2c3e50; color: white; padding-top: 50px; }
        .box { background: white; color: black; padding: 20px; display: inline-block; border-radius: 10px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; }
        button { background: #27ae60; color: white; border: none; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🍽️ سجل حجزك هنا</h2>
        <form action="/book" method="GET">
            <input type="text" name="name" placeholder="اسمك" required>
            <input type="text" name="time" placeholder="الساعة كام؟" required>
            <button type="submit">تأكيد الحجز</button>
        </form>
    </div>
</body>
</html>
